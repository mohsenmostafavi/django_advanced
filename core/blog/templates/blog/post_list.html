<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    {% for article in articles %}
    <article>
        <a href="{% url 'blog:detail view' pk=article.id %}">
            <h2>{{ article.title }}</h2>
        </a>
        <p>{{ article.body }}</p>
        <a href="{% url 'blog:edit_view' pk=article.id %}">
            <h5>Edit</h5>
        </a>
        <a href="{% url 'blog:delete_view' pk=article.id %}">
            <h5>Delete</h5>
        </a>
    </article>

    {% endfor %}

    {% if is_paginated %}
    <nav aria-label="صفحه‌بندی">

        {% if page_obj.has_previous %}
        <a href="?page={{ page_obj.previous_page_number }}">
            قبلی
        </a>
        {% endif %}

        <span>
            صفحهٔ {{ page_obj.number }}
            از {{ page_obj.paginator.num_pages }}
        </span>

        {% if page_obj.has_next %}
        <a href="?page={{ page_obj.next_page_number }}">
            بعدی
        </a>
        {% endif %}

    </nav>
    {% endif %}


</body>

</html>
